name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not ubuntu-latest: that label moves to 26.04 gradually from
        # 2026-10-19 to 2026-11-19 (actions/runner-images#14748), so runs would
        # land on either image during the rollout.
        os: [ubuntu-26.04, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse3-dev pkg-config fuse3 attr
          # src/main.rs mounts with SessionACL::RootAndOwner, which passes allow_other;
          # non-root users need this in fuse.conf
          grep -qxF user_allow_other /etc/fuse.conf \
            || echo user_allow_other | sudo tee -a /etc/fuse.conf

      - name: Install macFUSE (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          # The macFUSE kext cannot load on GitHub's hosted runners (requires
          # System Settings → Privacy & Security approval), but its headers,
          # libfuse dylibs, and fuse.pc install under $(brew --prefix), which
          # is what `cargo build` needs. The e2e smoke test is skipped on
          # macOS because a live mount requires the kext to be loaded.

      - name: Build
        run: cargo build

      - name: Unit and integration tests
        run: cargo test

      - name: End-to-end smoke test
        if: runner.os == 'Linux'
        run: bash scripts/smoke-test.sh /tmp/sqlitefs-mnt ./target/debug/sqlite-fs

  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  security:
    name: security
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # RustSec advisories for every crate in Cargo.lock.
      - name: cargo audit
        run: cargo audit

      # RustSec and GitHub's advisory database do not track SQLite's own CVEs
      # against libsqlite3-sys; compare the bundled version with sqlite.org.
      - name: Bundled SQLite vs sqlite.org CVE list
        if: success() || failure()
        run: python3 scripts/check-sqlite-cves.py
