name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse3-dev pkg-config fuse3 attr
          # src/main.rs hardcodes allow_other; non-root users need this in fuse.conf
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf

      - name: Install macFUSE (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          # The macFUSE kext cannot load on GitHub's hosted runners (requires
          # System Settings → Privacy & Security approval), but its headers,
          # libfuse dylibs, and fuse.pc are installed at /usr/local/ regardless,
          # which is all `cargo build` needs. The e2e smoke test is skipped on
          # macOS because a live mount requires the kext to be loaded.

      - name: Build
        run: cargo build --verbose

      - name: Unit and integration tests
        run: cargo test --verbose

      - name: End-to-end smoke test
        if: runner.os == 'Linux'
        run: bash scripts/smoke-test.sh /tmp/sqlitefs-mnt ./target/debug/sqlite-fs

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
