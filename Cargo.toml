[package]
name = "sqlite-fs"
version = "0.1.0"
authors = ["Matsumura <naruaki.matt@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fuser = "0.17"
libc = "0.2"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
blake3 = "1.8.7"
# No "legacy" (decoding pre-1.0 zstd formats): no chunk was ever written in one.
zstd = { version = "0.14.2", default-features = false }

[dependencies.clap]
version = "4.5.26"
features = ["cargo","color"]

[dependencies.rusqlite]
version = "0.40"
# fallible_uint: u64 <-> INTEGER (errors past i64::MAX), the 0.31 default.
features = ["bundled", "blob", "fallible_uint", "functions"]

[dependencies.nix]
version = "0.29"
features = ["fs"]

[dev-dependencies]
tempfile = "3"

